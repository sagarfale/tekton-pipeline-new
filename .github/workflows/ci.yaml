name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull-request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    name: categorize changes
    runs-on: ubuntu-latest
    outputs:
      non-docs: ${{ steps.detect.outputs.non-docs }}
      yaml: ${{ steps.detect.outputs.yaml }}
    steps:
    - name: Get base depth
      id: base-depth
      run: echo "base-depth=$(expr ${{ github.event.pull_request.commits }} + 1)" >> $GITHUB_OUTPUT
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: ${{ steps.base-depth.outputs.base-depth }}
        persist-credentials: false
    - name: detect
      id: detect
      run: |
        git fetch origin ${GITHUB_BASE_REF}
        CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | tr ' ' '\n')

        echo -e "Changed files:\n${CHANGED_FILES}"

        # If there are no changed files, non-docs and yaml are not set and remain false by default.
        # This ensures that jobs depending on these outputs do not run when there are no changes.
        if [[ -n "${CHANGED_FILES}" ]]; then
          NON_DOCS='false'
          YAML='false'

          while read -r file; do
            if [[ "$file" != *.md ]]; then
              NON_DOCS='true'
              break
            fi
          done <<< "${CHANGED_FILES}"

          while read -r file; do
            if [[ "$file" == *.yaml || "$file" == *.yml ]]; then
              YAML='true'
              break
            fi
          done <<< "${CHANGED_FILES}"

          echo "non-docs=${NON_DOCS}" | tee -a $GITHUB_OUTPUT
          echo "yaml=${YAML}" | tee -a $GITHUB_OUTPUT
        fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.non-docs == 'true' }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version-file: "go.mod"
    - name: build
      run: |
        go build -v ./...
  buildFips:
    name: buildFips
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.non-docs == 'true' }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version-file: "go.mod"
    - name: build
      run: |
        go build -v -tags "disable_spire,disable_tls" ./cmd/entrypoint
        echo "Build finished with exit code: $?"
  linting:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Used by golangci-lint to annotate code in the PR
    needs: [changes]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version-file: "go.mod"
    - name: gofmt
      if: ${{ needs.changes.outputs.non-docs == 'true' }}
      run: |
        gofmt_out=$(gofmt -d $(find * -name '*.go' ! -path 'vendor/*' ! -path 'third_party/*'))
        if [[ -n "$gofmt_out" ]]; then
            failed=1
        fi
        echo "$gofmt_out"
    - name: golangci-lint
      uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
      if: ${{ needs.changes.outputs.non-docs == 'true' }}
      with:
        version: v2.12.2
        install-mode: goinstall
        args: --new-from-merge-base=origin/${{ github.base_ref }} --timeout=10m
    - name: yamllint
      if: ${{ needs.changes.outputs.yaml == 'true' }}
      run: |
        apt-get update && apt-get install -y yamllint
        make yamllint
    - name: check-license
      if: ${{ needs.changes.outputs.non-docs == 'true' }}
      run: |
        go install github.com/google/go-licenses@v1.0.0
        go-licenses check ./...
  tests:
    needs: [build]
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version-file: "go.mod"
    - name: unit-test
      run: |
        make test-unit-verbose-and-race
  generated:
    needs: [build]
    name: Check generated code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version-file: "go.mod"
    - name: generated
      run: |
        ./hack/verify-codegen.sh
  multi-arch-build:
    needs: [build]
    name: Dockerfile release render
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
    - name: render release yaml
      run: |
        set -euo pipefail
        mkdir -p /tmp/release
        : > /tmp/built_images
        for cmd in controller webhook entrypoint nop workingdirinit resolvers sidecarlogresults events; do
          echo "example.com/github.com/tektoncd/pipeline/cmd/${cmd}:v0.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111" >> /tmp/built_images
        done
        PACKAGE=github.com/tektoncd/pipeline \
          VERSION_TAG=v0.0.0 \
          CONTAINER_REGISTRY=example.com \
          OUTPUT_RELEASE_DIR=/tmp/release \
          BUILT_IMAGES_FILE=/tmp/built_images \
          hack/render-docker-release-yaml.sh
  e2e-tests:
    needs: [build]
    uses: ./.github/workflows/e2e-matrix.yml
    with:
      is-draft: ${{ github.event.pull_request.draft }}

  ci-summary:
    name: CI summary
    needs: [build, buildFips, linting, tests, generated, multi-arch-build, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Block merge for draft PRs
      if: ${{ github.event.pull_request.draft == true }}
      run: |
        echo "::warning::Draft PR — only minimal e2e tests were run (amd64, k8s-latest, stable)"
        echo "Mark as 'Ready for Review' to run the full CI matrix."
        exit 1
      env:
        IS_DRAFT: ${{ github.event.pull_request.draft }}
    - name: Check CI results
      if: ${{ github.event.pull_request.draft == false }}
      run: |
        results=(
          "build=${NEEDS_BUILD_RESULT}"
          "buildFips=${NEEDS_BUILDFIPS_RESULT}"
          "linting=${NEEDS_LINTING_RESULT}"
          "tests=${NEEDS_TESTS_RESULT}"
          "generated=${NEEDS_GENERATED_RESULT}"
          "multi-arch-build=${NEEDS_MULTI_ARCH_BUILD_RESULT}"
          "e2e-tests=${NEEDS_E2E_TESTS_RESULT}"
        )
        failed=0
        for r in "${results[@]}"; do
          name="${r%%=*}"
          result="${r#*=}"
          echo "${name}: ${result}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            failed=1
          fi
        done
        if [ "$failed" -eq 1 ]; then
          echo ""
          echo "Some CI jobs failed or were cancelled"
          exit 1
        fi
        echo ""
        echo "All CI checks passed"
      env:
        NEEDS_BUILD_RESULT: ${{ needs.build.result }}
        NEEDS_BUILDFIPS_RESULT: ${{ needs.buildFips.result }}
        NEEDS_LINTING_RESULT: ${{ needs.linting.result }}
        NEEDS_TESTS_RESULT: ${{ needs.tests.result }}
        NEEDS_GENERATED_RESULT: ${{ needs.generated.result }}
        NEEDS_MULTI_ARCH_BUILD_RESULT: ${{ needs.multi-arch-build.result }}
        NEEDS_E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
